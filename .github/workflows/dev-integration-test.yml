name: Dev Integration Test

on:
  push:
    branches: [main]
    paths: ['**.tf', '**.tftest.hcl']
  pull_request:
    paths: ['**.tf', '**.tftest.hcl']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      provider_ref:
        description: 'Provider git ref (empty = default branch)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
  MONGODB_ATLAS_CLIENT_ID: ${{ secrets.MONGODB_ATLAS_CLIENT_ID }}
  MONGODB_ATLAS_CLIENT_SECRET: ${{ secrets.MONGODB_ATLAS_CLIENT_SECRET }}
  MONGODB_ATLAS_BASE_URL: ${{ secrets.MONGODB_ATLAS_BASE_URL }}

jobs:
  dev-integration-test:
    name: Dev Cluster Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            backup:
              - 'modules/cloud_backup_schedule/**'
              - 'tests/apply_backup_*.tftest.hcl'
      - uses: ./.github/actions/setup
        with:
          just: 'true'
          terraform: 'true'
          uv: 'true'
      - uses: ./.github/actions/setup-provider-dev
        with:
          provider-ref: ${{ inputs.provider_ref }}
      - name: Run dev integration tests
        env:
          RUN_BACKUP_TESTS: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.backup == 'true' }}
        run: |
          if [ "$RUN_BACKUP_TESTS" = "true" ]; then
            just dev-integration-test-backup
          else
            just dev-integration-test
          fi

  slack-notification:
    needs: [dev-integration-test]
    if: ${{ github.event_name == 'schedule' && !cancelled() && needs.dev-integration-test.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Slack message
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.event.repository.name }}: Dev Integration Test scheduled run failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *${{ github.event.repository.name }}: Dev Integration Test scheduled run failed* ${{ secrets.SLACK_ONCALL_TAG }} <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View failed run>"
                  }
                }
              ]
            }
