# path-sync copy -n sdlc
name: Manage JIRA tickets for GitHub issues

on:
  issues:
    types: [opened, reopened, closed]

permissions: {}

jobs:
  jira_task:
    name: Create Jira issue
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create JIRA ticket
        id: create
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          MODULE_NAME="${REPOSITORY_NAME#terraform-mongodbatlas-}"

          json_response=$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            --url 'https://jira.mongodb.org/rest/api/2/issue' \
            --header 'Authorization: Bearer '"${JIRA_API_TOKEN}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{
              "fields": {
                "project": {
                  "id": "10984"
                },
                "summary": "MODULE HELP: '"${MODULE_NAME}"' GitHub Issue n. '"${ISSUE_NUMBER}"'",
                "issuetype": {
                  "id": "12"
                },
                "customfield_12751": [
                  {
                    "id": "25550"
                  }
                ],
                "description": "This ticket tracks the following GitHub issue: '"${ISSUE_URL}"'.",
                "components": [
                  {
                    "id": "34035"
                  }
                ]
              }
            }')

          JIRA_TICKET_KEY=$(jq -er '.key' <<< "${json_response}")

          echo "The following JIRA ticket has been created: ${JIRA_TICKET_KEY}"
          echo "jira-ticket-key=${JIRA_TICKET_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Add comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          token: ${{ github.token }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for opening this issue. Please ensure you have included the information requested in [our bug report template](${{ github.server_url }}/${{ github.repository }}/issues/new?template=bug_report.yml) so we can reproduce it.

            The ticket [${{ steps.create.outputs.jira-ticket-key }}](https://jira.mongodb.org/browse/${{ steps.create.outputs.jira-ticket-key }}) was created for internal tracking.

  reopen_jira_ticket:
    name: Reopen JIRA ticket
    if: github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Reopen JIRA ticket if it exists
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          MODULE_NAME="${REPOSITORY_NAME#terraform-mongodbatlas-}"
          JIRA_QUERY="project = CLOUDP AND resolution = Declined AND text ~ \"MODULE HELP: ${MODULE_NAME} GitHub Issue n. ${ISSUE_NUMBER}\" ORDER BY created DESC"
          JIRA_URL=$(jq -rn --arg query "${JIRA_QUERY}" '$query | @uri')

          json_response=$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2 \
            --request GET \
            --url "https://jira.mongodb.org/rest/api/2/search?fields=id&maxResults=1&jql=${JIRA_URL}" \
            --header 'Authorization: Bearer '"${JIRA_API_TOKEN}" \
            --header 'Accept: application/json')

          JIRA_TICKET_ID=$(jq -r '.issues[0].id // empty' <<< "${json_response}")
          if [[ -z "${JIRA_TICKET_ID}" ]]; then
            echo "No matching JIRA ticket was found."
            exit 0
          fi

          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            --url "https://jira.mongodb.org/rest/api/2/issue/${JIRA_TICKET_ID}/transitions" \
            --header 'Authorization: Bearer '"${JIRA_API_TOKEN}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{
              "transition": {
                "id": "3"
              },
              "update": {
                "comment": [
                  {
                    "add": {
                      "body": "The related GitHub issue was reopened. Updated via automated process."
                    }
                  }
                ]
              }
            }'

  close_jira_ticket:
    name: Close JIRA ticket
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close JIRA ticket if it exists
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          MODULE_NAME="${REPOSITORY_NAME#terraform-mongodbatlas-}"
          JIRA_QUERY="project = CLOUDP AND resolution = Unresolved AND text ~ \"MODULE HELP: ${MODULE_NAME} GitHub Issue n. ${ISSUE_NUMBER}\" ORDER BY created DESC"
          JIRA_URL=$(jq -rn --arg query "${JIRA_QUERY}" '$query | @uri')

          json_response=$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2 \
            --request GET \
            --url "https://jira.mongodb.org/rest/api/2/search?fields=id&maxResults=1&jql=${JIRA_URL}" \
            --header 'Authorization: Bearer '"${JIRA_API_TOKEN}" \
            --header 'Accept: application/json')

          JIRA_TICKET_ID=$(jq -r '.issues[0].id // empty' <<< "${json_response}")
          if [[ -z "${JIRA_TICKET_ID}" ]]; then
            echo "No matching JIRA ticket was found."
            exit 0
          fi

          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            --url "https://jira.mongodb.org/rest/api/2/issue/${JIRA_TICKET_ID}/transitions" \
            --header 'Authorization: Bearer '"${JIRA_API_TOKEN}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{
              "transition": {
                "id": "1371"
              },
              "update": {
                "comment": [
                  {
                    "add": {
                      "body": "The related GitHub issue was closed. Resolved via automated process."
                    }
                  }
                ]
              },
              "fields": {
                "resolution": {
                  "name": "Declined"
                }
              }
            }'
