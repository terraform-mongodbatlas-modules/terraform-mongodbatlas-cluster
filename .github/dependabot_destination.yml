# This destination-only configuration manages GitHub Actions updates.
# Cluster owns the fully SDLC-synced UV and Go dependency surfaces.
# Keep shared GitHub Actions settings aligned with the active cluster config.
# If a new dependency surface is fully SDLC-synced, keep its updates cluster-owned.
#
# SDLC-excluded dependency surfaces:
# - uv /tools: tools/pyproject.toml and tools/uv.lock.
# - gomod /tools/changelog/check-changelog-entry-file: go.mod and go.sum.
version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
