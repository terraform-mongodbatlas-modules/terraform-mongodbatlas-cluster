# path-sync copy -n sdlc
# Triages Dependabot pull requests in SDLC destination repositories only.
# Covers mixed dependency surfaces that cannot be fully excluded from destination Dependabot updates.
# Keep its scope aligned with the destination Dependabot config and SDLC mapping.
name: Dependabot SDLC Triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          just: 'true'
          uv: 'true'
      - name: Classify changed paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just dependabot-sdlc-triage
