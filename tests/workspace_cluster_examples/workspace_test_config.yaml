# Workspace test configuration for cluster module examples
# Examples are grouped by project to respect 30-node limit per project
#
# Node counts:
# - 01: 3, 03: 4, 04: 5, 05: 5 (project1 = 17)
# - 08: 3, 09: 3 (project2 = 6)

resource_type_import_ids:
  mongodbatlas_advanced_cluster: "{project_id}-{name}"

# Provider does not import TF-only attrs; module always writes them after import.
_cluster_import_known_changes: &cluster_import_known_changes
  - address: module.cluster.mongodbatlas_advanced_cluster.this
    actions: [update]
    changed_attributes: [retain_backups_enabled]

examples:
  # Project 1: Examples 01, 03, 04, 05 (17 nodes)
  - number: 1
    var_groups: [shared, project1]
    import_validation:
      enabled: true
      known_changes: *cluster_import_known_changes
    plan_regressions:
      - address: module.cluster.mongodbatlas_advanced_cluster.this
  - number: 3
    var_groups: [shared, project1]
    import_validation:
      enabled: true
      known_changes: *cluster_import_known_changes
    plan_regressions:
      - address: module.cluster.mongodbatlas_advanced_cluster.this
  - number: 4
    var_groups: [shared, project1]
    import_validation:
      enabled: true
      known_changes: *cluster_import_known_changes
    plan_regressions:
      - address: module.cluster.mongodbatlas_advanced_cluster.this
  - number: 5
    var_groups: [shared, project1]
    import_validation:
      enabled: true
      known_changes: *cluster_import_known_changes
    plan_regressions:
      - address: module.cluster.mongodbatlas_advanced_cluster.this
  # Project 2: Examples 08-09 (6 nodes)
  - number: 8
    var_groups: [shared, project2]
    import_validation:
      enabled: true
      known_changes: *cluster_import_known_changes
    plan_regressions:
      - address: module.cluster.mongodbatlas_advanced_cluster.this
  - number: 9
    var_groups: [shared, project2]
    import_validation:
      enabled: true
      known_changes:
        - address: module.replication_var.mongodbatlas_advanced_cluster.this
          actions: [update]
          changed_attributes: [retain_backups_enabled]
    plan_regressions:
      - address: module.replication_var.mongodbatlas_advanced_cluster.this
# Examples 07, 10, 11, 12 removed (multi-shard clusters)

var_groups:
  shared:
    - name: tags
      expose_in_workspace: true
      var_type: map(string)
      module_value: "null"
  project1:
    - name: project_id
      expose_in_workspace: false
      module_value: local.project_id1
  project2:
    - name: project_id
      expose_in_workspace: false
      module_value: local.project_id2
